<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjay City Nutrition Council - Official Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Roboto Slab for Government Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gov-title {
            font-family: 'Roboto Slab', serif;
        }
        /* Custom scrollbar matching the green nutrition theme */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #059669;
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-emerald-50/20 text-slate-800 flex flex-col min-h-screen">

    <div id="root" class="flex flex-col min-h-screen"></div>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const barangayNutritionData = {
            "Poblacion I": { normal: 85, underweight: 8, stunted: 5, overweight: 2, totalWeighed: 450 },
            "Poblacion II": { normal: 88, underweight: 6, stunted: 4, overweight: 2, totalWeighed: 380 },
            "Poblacion III": { normal: 81, underweight: 11, stunted: 6, overweight: 2, totalWeighed: 520 },
            "Poblacion IV": { normal: 83, underweight: 9, stunted: 5, overweight: 3, totalWeighed: 490 },
            "Poblacion V": { normal: 87, underweight: 7, stunted: 4, overweight: 2, totalWeighed: 410 },
            "Poblacion VI": { normal: 84, underweight: 10, stunted: 5, overweight: 1, totalWeighed: 360 },
            "Poblacion VII": { normal: 86, underweight: 8, stunted: 4, overweight: 2, totalWeighed: 430 },
            "Poblacion VIII": { normal: 82, underweight: 11, stunted: 5, overweight: 2, totalWeighed: 400 },
            "Azagra": { normal: 75, underweight: 15, stunted: 8, overweight: 2, totalWeighed: 590 },
            "Bahi-an": { normal: 79, underweight: 13, stunted: 6, overweight: 2, totalWeighed: 310 },
            "Luca": { normal: 74, underweight: 16, stunted: 9, overweight: 1, totalWeighed: 510 },
            "Novallas": { normal: 80, underweight: 12, stunted: 6, overweight: 2, totalWeighed: 460 },
            "Obogon": { normal: 77, underweight: 14, stunted: 7, overweight: 2, totalWeighed: 480 },
            "Pal-pinas": { normal: 78, underweight: 13, stunted: 7, overweight: 2, totalWeighed: 390 },
            "Polo": { normal: 81, underweight: 10, stunted: 6, overweight: 3, totalWeighed: 550 },
            "San Isidro": { normal: 73, underweight: 17, stunted: 8, overweight: 2, totalWeighed: 620 },
            "San Jose": { normal: 83, underweight: 9, stunted: 5, overweight: 3, totalWeighed: 410 },
            "San Miguel": { normal: 80, underweight: 12, stunted: 6, overweight: 2, totalWeighed: 470 },
            "Santa Cruz Nuevo": { normal: 82, underweight: 10, stunted: 6, overweight: 2, totalWeighed: 550 },
            "Santa Cruz Viejo": { normal: 84, underweight: 8, stunted: 5, overweight: 3, totalWeighed: 480 },
            "Santo Niño": { normal: 76, underweight: 14, stunted: 7, overweight: 3, totalWeighed: 670 },
            "Tugas": { normal: 78, underweight: 12, stunted: 8, overweight: 2, totalWeighed: 610 },
            "Mandem": { normal: 79, underweight: 13, stunted: 6, overweight: 2, totalWeighed: 340 },
            "Sycip": { normal: 82, underweight: 11, stunted: 5, overweight: 2, totalWeighed: 320 }
        };

        const initialMockDocuments = [
            { id: "eOPT-9082", fileName: "eOPT_Poblacion_IV_Consolidated.xlsx", size: "1.4 MB", type: "e-OPT Spreadsheet (.xlsx)", uploadedBy: "Imelda R. Marcos", date: "2026-05-12", status: "Approved", feedback: "Matches database totals." },
            { id: "eOPT-8821", fileName: "Supplementary_Feeding_Polo_June.xlsx", size: "820 KB", type: "Feeding Logs", uploadedBy: "Paz Marquez-Benitez", date: "2026-06-01", status: "Approved", feedback: "Approved for fund release." },
            { id: "eOPT-7751", fileName: "Stunting_Correction_Survey_Luca.pdf", size: "2.1 MB", type: "Census Document", uploadedBy: "Patrocinio L. Gamboa", date: "2026-06-04", status: "Pending", feedback: "" }
        ];

        const initialStaffDirectory = [
            { id: "TNJ-OFF-10", name: "Chan Labechan", role: "Officer", title: "Tanjay City Nutrition Council Officer", email: "chanlabechan@gmail.com", mobile: "0917-415-3119", status: "Active" },
            { id: "TNJ-BNS-30", name: "Christian Labe", role: "BNS", title: "Barangay Nutrition Scholar", barangay: "Poblacion IV", email: "christian.labe@caremin.com", mobile: "0995-102-3490", status: "Active" }
        ];

        function App() {
            const [selectedBarangay, setSelectedBarangay] = useState("Poblacion IV");
            const [calculatorHeight, setCalculatorHeight] = useState("");
            const [calculatorWeight, setCalculatorWeight] = useState("");
            const [calculatorAge, setCalculatorAge] = useState("");
            const [calculatorGender, setCalculatorGender] = useState("male");
            const [bmiResult, setBmiResult] = useState(null);
            const [notification, setNotification] = useState(null);
            const [activeTab, setActiveTab] = useState("home");
            const [searchQuery, setSearchQuery] = useState("");
            const [aboutDropdownOpen, setAboutDropdownOpen] = useState(false);

            const [currentSlide, setCurrentSlide] = useState(0);
            const carouselSlides = [
                {
                    image: "https://i.imgur.com/zULeKTE.png",
                    dateText: "May 15, 2026 / Day 2 / 8:00 am - 5:00 pm",
                    title: "City Level MELLPI Evaluation conducted by RNET",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 45%"
                },
                {
                    image: "https://i.imgur.com/BYn4frU.png",
                    dateText: "May 18, 2026 / Day 1 / 9:00 am - 12:00 pm",
                    title: "School-Based Feeding Program (SBFP) Fortified Milk Delivery",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/ez1RtKx.png",
                    dateText: "May 28, 2026 / 4:00 pm",
                    title: "Best Practice Project initiated by City Mayor Jose T. Orlino in collaboration with City Agriculture Office & CNC",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center top"
                },
                {
                    image: "https://i.imgur.com/m2IuJaC.png",
                    dateText: "May 26, 2026 / 2:00 pm - 5:00 pm",
                    title: "Coordination Meeting w/ CNC Dumaguete for the National Nutrition Month launching to be held in NIR",
                    location: "DUMAGUETE CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 40%"
                },
                {
                    image: "https://i.imgur.com/3Xyc9l7.png",
                    dateText: "May 28, 2026 / Day 2 / 8:00 am - 11:30 am",
                    title: "Bio-Intensive Home Garden Distribution and Community Planting",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/HmAljwi.png",
                    dateText: "June 02, 2026 / Day 1 / 9:00 am - 2:00 pm",
                    title: "Emergency Dietary Supplement and Vitamin Package Handover",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/JAfbeAc.png",
                    dateText: "June 05, 2026 / Day 2 / 1:00 pm - 5:00 pm",
                    title: "Regional Action Plan Review alongside Municipal Health Planners",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 85%"
                }
            ];

            const [currentUser, setCurrentUser] = useState(null);
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [isSubmittingAuth, setIsSubmittingAuth] = useState(false);
            const [uploadedFiles, setUploadedFiles] = useState(initialMockDocuments);
            const [selectedFileToUpload, setSelectedFileToUpload] = useState(null);
            const [fileCategory, setFileCategory] = useState("e-OPT Spreadsheet (.xlsx)");
            const [staffList, setStaffList] = useState(initialStaffDirectory);
            const [selectedDay, setSelectedDay] = useState("Monday");
            const [editMenuInput, setEditMenuInput] = useState("");
            const fileInputRef = useRef(null);

            const [menuPlan, setMenuPlan] = useState({
                Monday: "Fortified Nutri-Instant Champorado with Ground Malunggay Powder & Boiled Egg",
                Tuesday: "Utan Kinunot (Mashed locally caught fish cooked in coconut milk with squash and moringa leaves)",
                Wednesday: "Fortified Munggo (Mung Beans) with Sweet Potato (Camote) cubes & leafy greens",
                Thursday: "Local Chicken Tinola soup packed with fresh papaya and young chili/malunggay leaves",
                Friday: "Boiled Sweet Potato (Camote) and Banana saba snacks paired with fresh milk"
            });

            const [sysLogs, setSysLogs] = useState([
                { time: "10:14 AM", user: "Chan Labechan (Officer)", action: "Accessed City Dashboard" },
                { time: "09:30 AM", user: "Christian Labe (BNS)", action: "Logged in via Poblacion IV portal" }
            ]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 5000);
            };

            useEffect(() => {
                const handleGlobalClick = () => {
                    setAboutDropdownOpen(false);
                };
                window.addEventListener('click', handleGlobalClick);
                return () => {
                    window.removeEventListener('click', handleGlobalClick);
                };
            }, []);

            useEffect(() => {
                if (activeTab === "home") {
                    const slideTimer = setInterval(() => {
                        setCurrentSlide(prev => (prev + 1) % carouselSlides.length);
                    }, 5000);
                    return () => clearInterval(slideTimer);
                }
            }, [activeTab]);

            useEffect(() => {
                if (currentUser && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler((dbData) => {
                        if (dbData && dbData.length > 0) setUploadedFiles(dbData);
                    }).fetchDocumentRegistry();

                    google.script.run.withSuccessHandler((dbLogs) => {
                        if (dbLogs && dbLogs.length > 0) setSysLogs(dbLogs);
                    }).fetchSystemLogs();
                }
            }, [currentUser]);

            const handleFormLogin = (e) => {
                e.preventDefault();
                setIsSubmittingAuth(true);

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSubmittingAuth(false);
                            if (res.success) {
                                setCurrentUser(res.profile);
                                setLoginEmail("");
                                setLoginPassword("");
                                showNotification(`Welcome, ${res.profile.name}!`, "success");
                                setActiveTab("portal-home");
                            } else {
                                showNotification(res.error, "error");
                            }
                        })
                        .withFailureHandler((err) => {
                            setIsSubmittingAuth(false);
                            showNotification("Critical Server Error connecting to Apps Script API.", "error");
                        })
                        .authenticateUser(loginEmail, loginPassword);
                } else {
                    // Sandbox local verification fallback
                    setTimeout(() => {
                        setIsSubmittingAuth(false);
                        const cleanEmail = loginEmail.toLowerCase().trim();
                        
                        const sandboxDatabase = {
                            "chanlabechan@gmail.com": {
                                password: "officer123",
                                profile: { id: "TNJ-OFF-10", name: "Chan Labechan", role: "Officer", title: "Tanjay City Nutrition Council Officer" }
                            },
                            "christian.labe@caremin.com": {
                                password: "bns123",
                                profile: { id: "TNJ-BNS-30", name: "Christian Labe", role: "BNS", title: "Barangay Nutrition Scholar", barangay: "Poblacion IV" }
                            }
                        };

                        const account = sandboxDatabase[cleanEmail];
                        if (account && account.password === loginPassword) {
                            setCurrentUser(account.profile);
                            setLoginEmail("");
                            setLoginPassword("");
                            showNotification(`Sandbox Success! Logged in as ${account.profile.name}`, "success");
                            setActiveTab("portal-home");
                        } else {
                            showNotification("Invalid Sandbox credentials.", "error");
                        }
                    }, 500);
                }
            };

            const handleLogout = () => {
                if (currentUser && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.logAction(currentUser.name, "Logged out from session");
                }
                setCurrentUser(null);
                setActiveTab("home");
                showNotification("Logged out successfully.", "success");
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFileToUpload(e.target.files[0]);
                }
            };

            const handleFileUploadSubmit = (e) => {
                e.preventDefault();
                if (!selectedFileToUpload) {
                    showNotification("Please select a physical file to upload.", "error");
                    return;
                }

                const file = selectedFileToUpload;
                const sizeString = (file.size / (1024 * 1024)).toFixed(1) + " MB";
                const uploader = currentUser ? currentUser.name : "Guest Scholar";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    showNotification("Uploading file to Google Drive & logging to Sheet...", "info");
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Data = evt.target.result;
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (res.success) {
                                    showNotification(res.message, "success");
                                    google.script.run.withSuccessHandler((dbData) => {
                                        setUploadedFiles(dbData);
                                    }).fetchDocumentRegistry();
                                    google.script.run.withSuccessHandler((dbLogs) => {
                                        setSysLogs(dbLogs);
                                    }).fetchSystemLogs();
                                } else {
                                    showNotification(res.message, "error");
                                }
                            })
                            .uploadFileToDrive(base64Data, file.name, fileCategory, uploader, sizeString);
                    };
                    reader.readAsDataURL(file);
                } else {
                    const newDoc = {
                        id: "eOPT-" + Math.floor(1000 + Math.random() * 9000),
                        fileName: file.name,
                        size: sizeString,
                        type: fileCategory,
                        uploadedBy: uploader,
                        date: new Date().toISOString().split('T')[0],
                        status: "Pending",
                        feedback: ""
                    };
                    setUploadedFiles([newDoc, ...uploadedFiles]);
                    showNotification("File uploaded (Sandbox)", "success");
                }

                setSelectedFileToUpload(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleApproveDocument = (docId, feedbackText) => {
                const feedback = feedbackText || "Validated by Nutrition Specialist.";
                const reviewer = currentUser ? currentUser.name : "Reviewer";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                showNotification(`Document ${docId} approved.`, "success");
                                google.script.run.withSuccessHandler((dbData) => {
                                    setUploadedFiles(dbData);
                                }).fetchDocumentRegistry();
                                google.script.run.withSuccessHandler((dbLogs) => {
                                    setSysLogs(dbLogs);
                                }).fetchSystemLogs();
                            } else {
                                showNotification(res.message, "error");
                            }
                        })
                        .updateDocumentStatusInSheet(docId, "Approved", feedback, reviewer);
                } else {
                    setUploadedFiles(prev => prev.map(doc => {
                        if (doc.id === docId) {
                            return { ...doc, status: "Approved", feedback: feedback };
                        }
                        return doc;
                    }));
                    showNotification(`Document ${docId} approved (Sandbox).`, "success");
                }
            };

            const handleRejectDocument = (docId, feedbackText) => {
                const feedback = feedbackText || "Requires signature in bottom corner.";
                const reviewer = currentUser ? currentUser.name : "Reviewer";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                showNotification(`Document ${docId} marked for review.`, "error");
                                google.script.run.withSuccessHandler((dbData) => {
                                    setUploadedFiles(dbData);
                                }).fetchDocumentRegistry();
                                google.script.run.withSuccessHandler((dbLogs) => {
                                    setSysLogs(dbLogs);
                                }).fetchSystemLogs();
                            } else {
                                showNotification(res.message, "error");
                            }
                        })
                        .updateDocumentStatusInSheet(docId, "Needs Revision", feedback, reviewer);
                } else {
                    setUploadedFiles(prev => prev.map(doc => {
                        if (doc.id === docId) {
                            return { ...doc, status: "Needs Revision", feedback: feedback };
                        }
                        return doc;
                    }));
                    showNotification(`Document ${docId} marked for review (Sandbox).`, "error");
                }
            };

            const handleBmiCalculation = (e) => {
                e.preventDefault();
                if (!calculatorHeight || !calculatorWeight) {
                    showNotification("Please fill in both height and weight.", "error");
                    return;
                }
                const heightInMeters = parseFloat(calculatorHeight) / 100;
                const weightInKg = parseFloat(calculatorWeight);
                const bmi = (weightInKg / (heightInMeters * heightInMeters)).toFixed(1);
                
                let classification = "";
                let advice = "";
                let colorClass = "";

                if (bmi < 18.5) {
                    classification = "Underweight / Wasted";
                    colorClass = "text-[#1da187] bg-emerald-50 border-emerald-200";
                    advice = "Incorporate nutrient-dense foods using local Tanjay agricultural crops. We highly recommend adding Moringa (Malunggay) powder to soups, eating locally grown Sweet Potato (Camote), fresh eggs, Mung Beans (Munggo), and participating in the local Nutri-Instant Champorado SBFP programs.";
                } else if (bmi >= 18.5 && bmi < 24.9) {
                    classification = "Normal Status";
                    colorClass = "text-[#1da187] bg-emerald-50/50 border-emerald-100";
                    advice = "Excellent! Maintain your active health. Ensure a balanced plate based on the DOST-FNRI 'Pinggang Pinoy' standard: 1/2 plate of Glow foods (fruits and vegetables like local eggplant, squash, and malunggay), 1/4 Grow foods (local fish or chicken), and 1/4 Go foods (rice or root crops).";
                } else if (bmi >= 25 && bmi < 29.9) {
                    classification = "Overweight";
                    colorClass = "text-amber-700 bg-amber-50 border-amber-200";
                    advice = "Moderation is key. Try reducing portion sizes of Go foods (white rice) and substituting with fiber-rich crops like boiled Camote. Increase daily activity; we encourage residents to participate in local barangay dancing, recreational walking along the Tanjay River Boardwalk, and community sports.";
                } else {
                    classification = "Obese";
                    colorClass = "text-red-700 bg-red-50 border-red-200";
                    advice = "We strongly suggest booking a consultation with the Tanjay City Health Unit (CHU 1 or CHU 2) for clinical dietary planning. Focus on fresh vegetables, minimize sugary drinks, and engage in regular low-impact exercise under health personnel supervision.";
                }

                setBmiResult({ bmi, classification, advice, colorClass });
                showNotification("BMI Assessment completed!", "success");
            };

            const handleUpdateMenu = (e) => {
                e.preventDefault();
                setMenuPlan(prev => ({
                    ...prev,
                    [selectedDay]: editMenuInput
                }));
                setEditMenuInput("");
                showNotification("Weekly Menu updated!", "success");
            };

            const resources = [
                { title: "NNC e-OPT Local Level Tool (500-child capacity standard)", category: "NNC Templates", date: "2026-01-12", size: "1.8 MB", type: "XLSX" },
                { title: "NNC e-OPT Local Level Tool (1000-child capacity standard)", category: "NNC Templates", date: "2026-01-12", size: "2.4 MB", type: "XLSX" },
                { title: "Barangay Nutrition Council Reorganization Guide (EO No. 01 Series 2024)", category: "Executive Orders", date: "2024-01-02", size: "1.2 MB", type: "PDF" },
                { title: "Tanjay City Nutrition Action Plan (CNAP) 2023-2026", category: "Plans & Budgets", date: "2023-10-10", size: "4.8 MB", type: "PDF" },
                { title: "BNS Monthly Consolidated Accomplishment Report (MCAR)", category: "Forms", date: "2026-01-20", size: "310 KB", type: "PDF" }
            ];

            const filteredResources = resources.filter(res => 
                res.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                res.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="flex flex-col min-h-screen justify-between">
                    
                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center p-4 rounded-lg shadow-xl border transition-all duration-300 max-w-sm ${
                            notification.type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                        }`}>
                            <i className={`fa-solid ${notification.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} mr-3 text-lg text-[#1da187]`}></i>
                            <span className="text-sm font-medium">{notification.message}</span>
                            <button onClick={() => setNotification(null)} className="ml-auto text-slate-400 hover:text-slate-650">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                    {/* TOP NAVBAR */}
                    <nav className="bg-[#1da187] text-white py-4 shadow-md sticky top-0 z-40">
                        <div className="max-w-[1700px] mx-auto px-4 xl:px-12 2xl:px-16 flex flex-wrap items-center justify-center gap-6 md:gap-8 font-medium text-sm">
                            <button 
                                onClick={() => { setActiveTab("home"); setAboutDropdownOpen(false); }} 
                                className={`pb-1 transition-all hover:text-[#3ce6c3] border-b-2 ${activeTab === 'home' ? 'border-[#3ce6c3] text-[#3ce6c3]' : 'border-transparent text-white'}`}
                            >
                                Home
                            </button>
                            
                            <div className="relative">
                                <button 
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        setAboutDropdownOpen(!aboutDropdownOpen);
                                    }}
                                    className="hover:text-[#3ce6c3] pb-1 flex items-center gap-1 focus:outline-none"
                                >
                                    About CNC <i className="fa-solid fa-chevron-down text-[10px]"></i>
                                </button>
                                {aboutDropdownOpen && (
                                    <div 
                                        className="absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-2 text-slate-808 text-xs z-50 animate-fadeIn"
                                        onClick={(e) => e.stopPropagation()}
                                    >
                                        <button 
                                            onClick={() => { setActiveTab("home"); setAboutDropdownOpen(false); setTimeout(() => document.getElementById("about-section")?.scrollIntoView({ behavior: 'smooth' }), 100); }} 
                                            className="w-full text-left px-4 py-2 hover:bg-emerald-50 font-semibold text-[#1da187]"
                                        >
                                            Our Mandate
                                        </button>
                                        <button 
                                            onClick={() => { setActiveTab("home"); setAboutDropdownOpen(false); setTimeout(() => document.getElementById("sbfp-info")?.scrollIntoView({ behavior: 'smooth' }), 100); }} 
                                            className="w-full text-left px-4 py-2 hover:bg-emerald-50 font-semibold text-[#1da187]"
                                        >
                                            Latest Campaigns
                                        </button>
                                    </div>
                                )}
                            </div>

                            <button 
                                onClick={() => { setActiveTab("dashboard"); setAboutDropdownOpen(false); }} 
                                className={`pb-1 transition-all hover:text-[#3ce6c3] border-b-2 ${activeTab === 'dashboard' ? 'border-[#3ce6c3] text-[#3ce6c3]' : 'border-transparent text-white'}`}
                            >
                                e-OPT Dashboard
                            </button>

                            <button

                                    <div className="lg:col-span-2 space-y-6">
                                        
                                        {/* Real-time registry table */}
                                        <div className="bg-white rounded-2xl border border-emerald-100 p-5 shadow-sm">
                                            <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                                                <h4 className="font-bold text-slate-800 text-base flex items-center gap-1.5">
                                                    <i className="fa-solid fa-list-check text-[#1da187]"></i> Submitted Document Registry
                                                </h4>
                                                <span className="bg-slate-100 text-slate-605 text-xs font-bold px-2 py-0.5 rounded-full">
                                                    {uploadedFiles.filter(doc => currentUser.role !== "BNS" || doc.uploadedBy === currentUser.name).length} Records
                                                </span>
                                            </div>

                                            <div className="space-y-4 max-h-[480px] overflow-y-auto pr-2">
                                                {uploadedFiles
                                                    .filter(doc => currentUser.role !== "BNS" || doc.uploadedBy === currentUser.name)
                                                    .map((doc) => (
                                                    <div key={doc.id} className="p-4 bg-slate-50 rounded-xl border border-slate-202 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all">
                                                        <div className="space-y-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-mono text-xs font-bold text-[#1da187]">{doc.id}</span>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                                                    doc.status === 'Approved' ? 'bg-emerald-100 text-emerald-900' :
                                                                    doc.status === 'Pending' ? 'bg-amber-100 text-amber-900' : 'bg-red-100 text-red-800'
                                                                }`}>
                                                                    {doc.status}
                                                                </span>
                                                                <span className="text-[9px] bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-md">{doc.type}</span>
                                                            </div>
                                                            <h5 className="font-bold text-slate-800 text-sm">{doc.fileName}</h5>
                                                            <p className="text-[10px] text-slate-500">
                                                                Transmitted by: <strong>{doc.uploadedBy}</strong> on {doc.date} ({doc.size})
                                                            </p>
                                                            {doc.feedback && (
                                                                <div className="mt-2 text-[11px] bg-white p-2 rounded-lg border border-slate-100 text-slate-600">
                                                                    <i className="fa-solid fa-comment-dots text-[#1da187]"></i> Review Note: <em>{doc.feedback}</em>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <div className="flex gap-2 shrink-0 w-full md:w-auto justify-end">
                                                            {doc.status === "Pending" && (currentUser.role === "Nutritionist" || currentUser.role === "Officer") ? (
                                                                <div className="flex gap-1.5 w-full md:w-auto">
                                                                    <button 
                                                                        onClick={() => handleApproveDocument(doc.id, "Validated after check.")}
                                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1"
                                                                    >
                                                                        <i className="fa-solid fa-check"></i> Approve
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => handleRejectDocument(doc.id, "Requires signature in bottom corner.")}
                                                                        className="bg-red-650 hover:bg-red-700 text-white font-bold text-xs py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i> Send Back
                                                                    </button>
                                                                </div>
                                                            ) : (
                                                                <button 
                                                                    onClick={() => showNotification(`Opening e-OPT record...`)}
                                                                    className="text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 font-bold text-xs py-1.5 px-3 rounded-lg flex items-center gap-1 transition-all"
                                                                >
                                                                    <i className="fa-solid fa-download"></i> Download File
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Weekly Nutrition plan card - Nutritionist Access */}
                                        {currentUser.role === "Nutritionist" && (
                                            <div className="bg-gradient-to-br from-[#1da187]/5 to-[#1da187]/10 rounded-2xl border border-emerald-100 p-5 shadow-sm animate-fadeIn">
                                                <h4 className="font-bold text-emerald-900 text-base mb-3 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-kitchen-set text-[#1da187]"></i> Localized Menu Planner (Nutritionist Hub)
                                                </h4>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div className="space-y-2">
                                                        <label className="block text-xs font-bold text-slate-600 uppercase">Target Feeding Day</label>
                                                        <select 
                                                            value={selectedDay} 
                                                            onChange={(e) => setSelectedDay(e.target.value)}
                                                            className="w-full bg-white text-slate-800 text-xs font-bold px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none"
                                                        >
                                                            {Object.keys(menuPlan).map(day => (
                                                                <option key={day} value={day}>{day}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                    <div className="md:col-span-2 space-y-2">
                                                        <label className="block text-xs font-bold text-slate-600 uppercase">Weekly Dish Formulation</label>
                                                        <form onSubmit={handleUpdateMenu} className="flex gap-2">
                                                            <input 
                                                                type="text" 
                                                                value={editMenuInput}
                                                                onChange={(e) => setEditMenuInput(e.target.value)}
                                                                placeholder={menuPlan[selectedDay]}
                                                                className="flex-grow bg-white text-slate-800 text-xs px-3 py-2 rounded-xl border border-slate-200"
                                                                required
                                                            />
                                                            <button type="submit" className="bg-[#1da187] hover:bg-emerald-655 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all">
                                                                Update
                                                            </button>
                                                        </form>
                                                    </div>
                                                </div>

                                                <div className="mt-4 p-3.5 bg-white rounded-xl border border-[#1da187]/10">
                                                    <span className="text-[10px] uppercase font-black text-slate-400 block tracking-wider">Current Menu for {selectedDay}:</span>
                                                    <p className="text-xs text-emerald-900 font-bold mt-1">"{menuPlan[selectedDay]}"</p>
                                                </div>
                                            </div>
                                        )}

                                        {/* Staff Directory Panel - Officer Access */}
                                        {currentUser.role === "Officer" && (
                                            <div className="bg-white rounded-2xl border border-emerald-100 p-5 shadow-sm animate-fadeIn">
                                                <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                                                    <h4 className="font-bold text-slate-800 text-base flex items-center gap-1.5">
                                                        <i className="fa-solid fa-users text-[#1da187]"></i> Whitelisted Directory ({staffList.length})
                                                    </h4>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[300px] overflow-y-auto pr-2">
                                                    {staffList.map((staff) => (
                                                        <div key={staff.id} className="p-3 bg-slate-50 rounded-xl border border-slate-202 flex items-center justify-between gap-2">
                                                            <div>
                                                                <span className="text-[9px] uppercase font-bold text-slate-400">{staff.role} {staff.barangay ? `• ${staff.barangay}` : ''}</span>
                                                                <h5 className="font-bold text-slate-800 text-xs">{staff.name}</h5>
                                                                <span className="block text-[10px] font-mono text-[#1da187] mt-0.5">{staff.email}</span>
                                                            </div>
                                                            <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-[#1da187]/20">
                                                                {staff.status}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* FOOTER STRIP WITH WHITE FONTS */}
                    <footer className="bg-emerald-950 text-white mt-12 border-t-4 border-[#3ce6c3]">
                        <div className="max-w-[1700px] mx-auto px-4 xl:px-12 2xl:px-16 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="space-y-4">
                                <h4 className="font-extrabold text-base text-white uppercase tracking-widest">Tanjay City CNC</h4>
                                <p className="text-xs text-white/90 leading-relaxed">
                                    The central health policy agency under the Office of the City Mayor dedicated to upgrading childhood nutrition, stunting management parameters, and school-feeding program transparency in Tanjay City.
                                </p>
                            </div>

                            <div className="space-y-4">
                                <h4 className="font-extrabold text-sm text-white uppercase tracking-wide">Government Quick Links</h4>
                                <ul className="text-xs text-white/90 space-y-2">
                                    <li><a href="https://www.gov.ph" target="_blank" className="hover:underline text-white hover:text-[#3ce6c3]"><i className="fa-solid fa-angle-right mr-1"></i> National Government Portal (GOV.PH)</a></li>
                                    <li><a href="https://www.depedtanjay.ph" target="_blank" className="hover:underline text-white hover:text-[#3ce6c3]"><i className="fa-solid fa-angle-right mr-1"></i> DepEd Division of Tanjay City</a></li>
                                </ul>
                            </div>

                            <div className="space-y-4">
                                <h4 className="font-extrabold text-sm text-white uppercase tracking-wide">Contact Council Desk</h4>
                                <div className="text-xs text-white/90 space-y-3">
                                    <p className="flex items-center gap-2"><i className="fa-solid fa-phone text-white"></i> Hotline: (035) 415-3119</p>
                                    <p className="flex items-center gap-2"><i className="fa-solid fa-envelope text-white"></i> nutrition@tanjay.gov.ph</p>
                                    <p className="flex items-center gap-2">
                                        <a 
                                            href="https://www.facebook.com/tanjaycitynutrition" 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="inline-flex items-center gap-1.5 hover:text-[#3ce6c3] text-white hover:underline transition-colors"
                                        >
                                            <i className="fa-brands fa-facebook text-white text-sm"></i> Facebook: Tanjay City Nutrition Page
                                        </a>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-emerald-900/40 py-4 text-xs text-center text-white/85 border-t border-emerald-900/60">
                            <div className="max-w-[1700px] mx-auto px-4 xl:px-12 2xl:px-16 flex flex-col sm:flex-row justify-between items-center gap-2">
                                <p className="text-white">© 2026 Tanjay City Nutrition Council. All Rights Reserved.</p>
                                <p className="text-[10px] text-white/75">Built in accordance with national government accessibility and security protocols.</p>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

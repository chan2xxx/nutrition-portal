        function App() {
            const [selectedBarangay, setSelectedBarangay] = useState("Poblacion IV");
            const [calculatorHeight, setCalculatorHeight] = useState("");
            const [calculatorWeight, setCalculatorWeight] = useState("");
            const [calculatorAge, setCalculatorAge] = useState("");
            const [calculatorGender, setCalculatorGender] = useState("male");
            const [bmiResult, setBmiResult] = useState(null);
            const [notification, setNotification] = useState(null);
            const [activeTab, setActiveTab] = useState("home");
            const [searchQuery, setSearchQuery] = useState("");

            const [currentUser, setCurrentUser] = useState(null);
            const [loginId, setLoginId] = useState("");
            const [loginPassword, setLoginPassword] = useState(""); 
            const [showAccountList, setShowAccountList] = useState(false);

            // Document Center States
            const [uploadedFiles, setUploadedFiles] = useState(initialMockDocuments);
            const [selectedFileToUpload, setSelectedFileToUpload] = useState(null);
            const [fileCategory, setFileCategory] = useState("OPT+ Scanned Sheet");
            const fileInputRef = useRef(null);

            // Nutritionist Menu Planner State
            const [selectedDay, setSelectedDay] = useState("Monday");
            const [menuPlan, setMenuPlan] = useState({
                Monday: "Fortified Nutri-Instant Champorado with Ground Malunggay Powder & Boiled Egg",
                Tuesday: "Utan Kinunot (Mashed locally caught fish cooked in coconut milk with squash and moringa leaves)",
                Wednesday: "Fortified Munggo (Mung Beans) with Sweet Potato (Camote) cubes & leafy greens",
                Thursday: "Local Chicken Tinola soup packed with fresh papaya and young chili/malunggay leaves",
                Friday: "Boiled Sweet Potato (Camote) and Banana saba snacks paired with fresh milk"
            });
            const [editMenuInput, setEditMenuInput] = useState("");

            // Council Security & Directory States
            const [staffList, setStaffList] = useState(initialStaffDirectory);
            const [sysLogs, setSysLogs] = useState([
                { time: "10:14 AM", user: "Dr. Jose Rizal V. Teves (Officer)", action: "Accessed City Dashboard" },
                { time: "09:30 AM", user: "Imelda R. Marcos (BNS)", action: "Logged in via Poblacion IV portal" },
                { time: "Yesterday", user: "Gabriela Silang-Diaz (Nutritionist)", action: "Approved Document DOC-9082" }
            ]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 5000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const matchedUser = staffList.find(staff => staff.id.toLowerCase() === loginId.trim().toLowerCase());
                
                if (matchedUser) {
                    setCurrentUser(matchedUser);
                    setLoginId("");
                    setLoginPassword("");
                    setSysLogs(prev => [
                        { time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: `${matchedUser.name} (${matchedUser.role})`, action: "Successfully Authenticated" },
                        ...prev
                    ]);
                    showNotification(`Welcome back, ${matchedUser.name}!`, "success");
                    setActiveTab("portal-home");
                } else {
                    showNotification("Invalid Staff ID. Please select one from the demo list.", "error");
                }
            };

            const handleLogout = () => {
                if (currentUser) {
                    setSysLogs(prev => [
                        { time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: `${currentUser.name} (${currentUser.role})`, action: "Logged out from session" },
                        ...prev
                    ]);
                }
                setCurrentUser(null);
                setActiveTab("home");
                showNotification("Logged out successfully.", "success");
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFileToUpload(e.target.files[0]);
                }
            };

            const handleFileUploadSubmit = (e) => {
                e.preventDefault();
                if (!selectedFileToUpload) {
                    showNotification("Please select a physical file to upload.", "error");
                    return;
                }

                const newDoc = {
                    id: "DOC-" + Math.floor(1000 + Math.random() * 9000),
                    fileName: selectedFileToUpload.name,
                    size: (selectedFileToUpload.size / (1024 * 1024)).toFixed(1) + " MB",
                    type: fileCategory,
                    uploadedBy: currentUser ? currentUser.name : "Guest Scholar",
                    date: new Date().toISOString().split('T')[0],
                    status: "Pending",
                    feedback: ""
                };

                setUploadedFiles([newDoc, ...uploadedFiles]);
                setSelectedFileToUpload(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
                
                setSysLogs(prev => [
                    { time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: currentUser?.name || "BNS Staff", action: `Uploaded file: ${newDoc.fileName}` },
                    ...prev
                ]);
                showNotification("File transmitted successfully to Council review!", "success");
            };

            const handleApproveDocument = (docId, feedbackText) => {
                setUploadedFiles(prev => prev.map(doc => {
                    if (doc.id === docId) {
                        return { ...doc, status: "Approved", feedback: feedbackText || "Validated by Nutrition Specialist." };
                    }
                    return doc;
                }));
                showNotification(`Document ${docId} approved successfully.`, "success");
            };

            const handleRejectDocument = (docId, feedbackText) => {
                setUploadedFiles(prev => prev.map(doc => {
                    if (doc.id === docId) {
                        return { ...doc, status: "Needs Revision", feedback: feedbackText || "Missing standard seals." };
                    }
                    return doc;
                }));
                showNotification(`Document ${docId} sent back for revision.`, "error");
            };

            const handleBmiCalculation = (e) => {
                e.preventDefault();
                if (!calculatorHeight || !calculatorWeight) {
                    showNotification("Please fill in both height and weight.", "error");
                    return;
                }
                const heightInMeters = parseFloat(calculatorHeight) / 100;
                const weightInKg = parseFloat(calculatorWeight);
                const bmi = (weightInKg / (heightInMeters * heightInMeters)).toFixed(1);
                
                let classification = "";
                let advice = "";
                let colorClass = "";

                if (bmi < 18.5) {
                    classification = "Underweight / Wasted";
                    colorClass = "text-emerald-700 bg-emerald-50 border-emerald-200";
                    advice = "Incorporate nutrient-dense foods using local Tanjay agricultural crops. We highly recommend adding Moringa (Malunggay) powder to soups, eating locally grown Sweet Potato (Camote), fresh eggs, Mung Beans (Munggo), and participating in the local Nutri-Instant Champorado SBFP programs.";
                } else if (bmi >= 18.5 && bmi < 24.9) {
                    classification = "Normal Status";
                    colorClass = "text-green-700 bg-green-50 border-green-200";
                    advice = "Excellent! Maintain your active health. Ensure a balanced plate based on the DOST-FNRI 'Pinggang Pinoy' standard: 1/2 plate of Glow foods (fruits and vegetables like local eggplant, squash, and malunggay), 1/4 Grow foods (local fish or chicken), and 1/4 Go foods (rice or root crops).";
                } else if (bmi >= 25 && bmi < 29.9) {
                    classification = "Overweight";
                    colorClass = "text-amber-700 bg-amber-50 border-amber-200";
                    advice = "Moderation is key. Try reducing portion sizes of Go foods (white rice) and substituting with fiber-rich crops like boiled Camote. Increase daily activity; we encourage residents to participate in local barangay dancing, recreational walking along the Tanjay River Boardwalk, and community sports.";
                } else {
                    classification = "Obese";
                    colorClass = "text-red-700 bg-red-50 border-red-200";
                    advice = "We strongly suggest booking a consultation with the Tanjay City Health Unit (CHU 1 or CHU 2) for clinical dietary planning. Focus on fresh vegetables, minimize sugary drinks, and engage in regular low-impact exercise under health personnel supervision.";
                }

                setBmiResult({ bmi, classification, advice, colorClass });
                showNotification("BMI Assessment completed!", "success");
            };

            const handleUpdateMenu = (e) => {
                e.preventDefault();
                setMenuPlan(prev => ({
                    ...prev,
                    [selectedDay]: editMenuInput
                }));
                setEditMenuInput("");
                showNotification("Weekly Menu updated!", "success");
            };

            const resources = [
                { title: "Barangay Nutrition Council Reorganization Guide (EO No. 01 Series 2024)", category: "Executive Orders", date: "2024-01-02", size: "1.2 MB", type: "PDF" },
                { title: "Operation Timbang Plus (OPT+) Form Template 2026", category: "Forms", date: "2026-02-15", size: "540 KB", type: "XLSX" },
                { title: "Tanjay City Nutrition Action Plan (CNAP) 2023-2026", category: "Plans & Budgets", date: "2023-10-10", size: "4.8 MB", type: "PDF" },
                { title: "Nutri-Instant Champorado Procurement Specification Guidelines", category: "Guidelines", date: "2026-03-06", size: "820 KB", type: "PDF" },
                { title: "BNS Monthly Consolidated Accomplishment Report (MCAR)", category: "Forms", date: "2026-01-20", size: "310 KB", type: "PDF" }
            ];

            const filteredResources = resources.filter(res => 
                res.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                res.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div class="flex flex-col min-h-screen justify-between">
                    
                    {notification && (
                        <div class={`fixed top-4 right-4 z-50 flex items-center p-4 rounded-lg shadow-xl border transition-all duration-300 max-w-sm ${
                            notification.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                        }`}>
                            <i class={`fa-solid ${notification.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} mr-3 text-lg`}></i>
                            <span class="text-sm font-medium">{notification.message}</span>
                            <button onClick={() => setNotification(null)} class="ml-auto text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                    {}
                    <nav class="bg-[#1da187] text-white py-4 shadow-md sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-6 md:gap-8 font-medium text-sm">
                            <button 
                                onClick={() => setActiveTab("home")} 
                                class={`pb-1 transition-all hover:text-[#3ce6c3] border-b-2 ${activeTab === 'home' ? 'border-[#3ce6c3] text-[#3ce6c3]' : 'border-transparent text-white'}`}
                            >
                                Home
                            </button>
                            
                            <div class="relative group cursor-pointer">
                                <span class="hover:text-[#3ce6c3] pb-1 flex items-center gap-1">
                                    About CNC <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                </span>
                                <div class="absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-2 text-slate-800 text-xs hidden group-hover:block transition-all z-50">
                                    <button onClick={() => { setActiveTab("home"); setTimeout(() => document.getElementById("about-section")?.scrollIntoView({ behavior: 'smooth' }), 100); }} class="w-full text-left px-4 py-2 hover:bg-emerald-50 font-semibold text-[#1da187]">
                                        Our Mandate
                                    </button>
                                    <button onClick={() => { setActiveTab("home"); setTimeout(() => document.getElementById("sbfp-info")?.scrollIntoView({ behavior: 'smooth' }), 100); }} class="w-full text-left px-4 py-2 hover:bg-emerald-50 font-semibold text-[#1da187]">
                                        Latest Campaigns
                                    </button>
                                </div>
                            </div>

                            <button 
                                onClick={() => setActiveTab("dashboard")} 
                                class={`pb-1 transition-all hover:text-[#3ce6c3] border-b-2 ${activeTab === 'dashboard' ? 'border-[#3ce6c3] text-[#3ce6c3]' : 'border-transparent text-white'}`}
                            >
                                OPT+ Dashboard
                            </button>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjay City Nutrition Council - Official Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Roboto Slab for Government Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gov-title {
            font-family: 'Roboto Slab', serif;
        }
        /* Custom High Contrast Class for Accessibility Mode */
        .accessibility-high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .accessibility-high-contrast .bg-white,
        .accessibility-high-contrast .bg-emerald-50,
        .accessibility-high-contrast .bg-slate-50,
        .accessibility-high-contrast .bg-emerald-50\/10,
        .accessibility-high-contrast .bg-emerald-50\/20,
        .accessibility-high-contrast .bg-emerald-50\/30 {
            background-color: #121212 !important;
            border-color: #ffffff !important;
        }
        .accessibility-high-contrast p,
        .accessibility-high-contrast h1,
        .accessibility-high-contrast h2,
        .accessibility-high-contrast h3,
        .accessibility-high-contrast h4,
        .accessibility-high-contrast h5,
        .accessibility-high-contrast span,
        .accessibility-high-contrast li {
            color: #ffffff !important;
        }
        .accessibility-high-contrast button,
        .accessibility-high-contrast a,
        .accessibility-high-contrast select {
            border: 2px solid #ffffff !important;
            color: #ffffff !important;
            background-color: #000000 !important;
        }
        /* Custom scrollbar matching the green nutrition theme */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #059669;
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-emerald-50/20 text-slate-800 flex flex-col min-h-screen overflow-x-hidden">

    <div id="root" class="flex flex-col min-h-screen"></div>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const defaultBarangayNutritionData = {
            "Poblacion I": { normal: 85, underweight: 8, stunted: 5, overweight: 2, totalWeighed: 450 },
            "Poblacion II": { normal: 88, underweight: 6, stunted: 4, overweight: 2, totalWeighed: 380 },
            "Poblacion III": { normal: 81, underweight: 11, stunted: 6, overweight: 2, totalWeighed: 520 },
            "Poblacion IV": { normal: 83, underweight: 9, stunted: 5, overweight: 3, totalWeighed: 490 },
            "Poblacion V": { normal: 87, underweight: 7, stunted: 4, overweight: 2, totalWeighed: 410 },
            "Poblacion VI": { normal: 84, underweight: 10, stunted: 5, overweight: 1, totalWeighed: 360 },
            "Poblacion VII": { normal: 86, underweight: 8, stunted: 4, overweight: 2, totalWeighed: 430 },
            "Poblacion VIII": { normal: 82, underweight: 11, stunted: 5, overweight: 2, totalWeighed: 400 },
            "Azagra": { normal: 75, underweight: 15, stunted: 8, overweight: 2, totalWeighed: 590 },
            "Bahi-an": { normal: 79, underweight: 13, stunted: 6, overweight: 2, totalWeighed: 310 },
            "Luca": { normal: 74, underweight: 16, stunted: 9, overweight: 1, totalWeighed: 510 },
            "Novallas": { normal: 80, underweight: 12, stunted: 6, overweight: 2, totalWeighed: 460 },
            "Obogon": { normal: 77, underweight: 14, stunted: 7, overweight: 2, totalWeighed: 480 },
            "Pal-pinas": { normal: 78, underweight: 13, stunted: 7, overweight: 2, totalWeighed: 390 },
            "Polo": { normal: 81, underweight: 10, stunted: 6, overweight: 3, totalWeighed: 550 },
            "San Isidro": { normal: 73, underweight: 17, stunted: 8, overweight: 2, totalWeighed: 620 },
            "San Jose": { normal: 83, underweight: 9, stunted: 5, overweight: 3, totalWeighed: 410 },
            "San Miguel": { normal: 80, underweight: 12, stunted: 6, overweight: 2, totalWeighed: 470 },
            "Santa Cruz Nuevo": { normal: 82, underweight: 10, stunted: 6, overweight: 2, totalWeighed: 550 },
            "Santa Cruz Viejo": { normal: 84, underweight: 8, stunted: 5, overweight: 3, totalWeighed: 480 },
            "Santo Niño": { normal: 76, underweight: 14, stunted: 7, overweight: 3, totalWeighed: 670 },
            "Tugas": { normal: 78, underweight: 12, stunted: 8, overweight: 2, totalWeighed: 610 },
            "Mandem": { normal: 79, underweight: 13, stunted: 6, overweight: 2, totalWeighed: 340 },
            "Sycip": { normal: 82, underweight: 11, stunted: 5, overweight: 2, totalWeighed: 320 }
        };

        const initialMockDocuments = [
            { id: "eOPT-9082", fileName: "eOPT_Poblacion_IV_Consolidated.xlsx", size: "1.4 MB", type: "e-OPT Spreadsheet (.xlsx)", uploadedBy: "Imelda R. Marcos", date: "2026-05-12", status: "Approved", feedback: "Matches database totals." },
            { id: "eOPT-8821", fileName: "Supplementary_Feeding_Polo_June.xlsx", size: "820 KB", type: "Feeding Logs", uploadedBy: "Paz Marquez-Benitez", date: "2026-06-01", status: "Approved", feedback: "Approved for fund release." },
            { id: "eOPT-7751", fileName: "Stunting_Correction_Survey_Luca.pdf", size: "2.1 MB", type: "Census Document", uploadedBy: "Patrocinio L. Gamboa", date: "2026-06-04", status: "Pending", feedback: "" }
        ];

        const initialStaffDirectory = [
            { id: "TNJ-OFF-10", name: "Stephy Detty", role: "Officer", title: "Tanjay City Nutrition Action Officer (CNAO)", email: "stephydetty14@gmail.com", mobile: "0917-415-3119", status: "Active" },
            { id: "TNJ-BNS-30", name: "Christian Labe", role: "BNS", title: "Barangay Nutrition Scholar", barangay: "Poblacion IV", email: "christian.labe@caremin.com", mobile: "0995-102-3490", status: "Active" }
        ];

        function App() {
            const [barangayNutritionData, setBarangayNutritionData] = useState(defaultBarangayNutritionData);
            const [selectedBarangay, setSelectedBarangay] = useState("Poblacion IV");
            const [calculatorHeight, setCalculatorHeight] = useState("");
            const [calculatorWeight, setCalculatorWeight] = useState("");
            const [calculatorAge, setCalculatorAge] = useState("");
            const [calculatorGender, setCalculatorGender] = useState("male");
            const [bmiResult, setBmiResult] = useState(null);
            const [notification, setNotification] = useState(null);
            const [activeTab, setActiveTab] = useState("home");
            const [searchQuery, setSearchQuery] = useState("");
            const [aboutDropdownOpen, setAboutDropdownOpen] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // Access Statement Modal State
            const [showAccessStatementModal, setShowAccessStatementModal] = useState(false);

            // UI Enhancement States
            const [fontSizeScale, setFontSizeScale] = useState(1); // 1 = 100%, 1.1 = 110%, etc.
            const [highContrastMode, setHighContrastMode] = useState(false);
            const [showBackToTop, setShowBackToTop] = useState(false);

            // Legal & Data Privacy Modal/Toggles
            const [showPrivacyModal, setShowPrivacyModal] = useState(false);
            const [privacyConsented, setPrivacyConsented] = useState(false);

            // Digital Input Form States
            const [formBarangay, setFormBarangay] = useState("Poblacion IV");
            const [rawNormal, setRawNormal] = useState("");
            const [rawUnderweight, setRawUnderweight] = useState("");
            const [rawStunted, setRawStunted] = useState("");
            const [rawOverweight, setRawOverweight] = useState("");
            const [isSubmittingMetrics, setIsSubmittingMetrics] = useState(false);

            const [currentSlide, setCurrentSlide] = useState(0);
            const carouselSlides = [
                {
                    image: "https://i.imgur.com/zULeKTE.png",
                    dateText: "May 15, 2026 / Day 2 / 8:00 am - 5:00 pm",
                    title: "City Level MELLPI Evaluation conducted by RNET",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 45%"
                },
                {
                    image: "https://i.imgur.com/BYn4frU.png",
                    dateText: "May 18, 2026 / Day 1 / 9:00 am - 12:00 pm",
                    title: "School-Based Feeding Program (SBFP) Fortified Milk Delivery",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/VnQrZKa.png",
                    dateText: "May 28, 2026 / 4:00 pm",
                    title: "Best Practice Project initiated by City Mayor Jose T. Orlino in collaboration with City Agriculture Office & CNC",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center top"
                },
                {
                    image: "https://i.imgur.com/KXiHJSA.png",
                    dateText: "May 26, 2026 / 2:00 pm - 5:00 pm",
                    title: "Coordination Meeting w/ CNC Dumaguete for the National Nutrition Month launching to be held in NIR",
                    location: "DUMAGUETE CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 40%"
                },
                {
                    image: "https://i.imgur.com/3Xyc9l7.png",
                    dateText: "May 28, 2026 / Day 2 / 8:00 am - 11:30 am",
                    title: "Bio-Intensive Home Garden Distribution and Community Planting",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/HmAljwi.png",
                    dateText: "June 02, 2026 / Day 1 / 9:00 am - 2:00 pm",
                    title: "Emergency Dietary Supplement and Vitamin Package Handover",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 35%"
                },
                {
                    image: "https://i.imgur.com/JAfbeAc.png",
                    dateText: "June 05, 2026 / Day 2 / 1:00 pm - 5:00 pm",
                    title: "Regional Action Plan Review alongside Municipal Health Planners",
                    location: "TANJAY CITY, NEGROS ISLAND REGION",
                    objectPosition: "center 85%"
                }
            ];

            const [currentUser, setCurrentUser] = useState(null);
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [isSubmittingAuth, setIsSubmittingAuth] = useState(false);
            const [uploadedFiles, setUploadedFiles] = useState(initialMockDocuments);
            const [selectedFileToUpload, setSelectedFileToUpload] = useState(null);
            const [fileCategory, setFileCategory] = useState("e-OPT Spreadsheet (.xlsx)");
            const [staffList, setStaffList] = useState(initialStaffDirectory);
            const [selectedDay, setSelectedDay] = useState("Monday");
            const [editMenuInput, setEditMenuInput] = useState("");
            const fileInputRef = useRef(null);

            const [menuPlan, setMenuPlan] = useState({
                Monday: "Fortified Nutri-Instant Champorado with Ground Malunggay Powder & Boiled Egg",
                Tuesday: "Utan Kinunot (Mashed locally caught fish cooked in coconut milk with squash and moringa leaves)",
                Wednesday: "Fortified Munggo (Mung Beans) with Sweet Potato (Camote) cubes & leafy greens",
                Thursday: "Local Chicken Tinola soup packed with fresh papaya and young chili/malunggay leaves",
                Friday: "Boiled Sweet Potato (Camote) and Banana saba snacks paired with fresh milk"
            });

            const [sysLogs, setSysLogs] = useState([
                { time: "10:14 AM", user: "Stephy Detty (CNAO)", action: "Accessed City Dashboard" },
                { time: "09:30 AM", user: "Christian Labe (BNS)", action: "Logged in via Poblacion IV portal" }
            ]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 5000);
            };

            useEffect(() => {
                const handleGlobalClick = () => {
                    setAboutDropdownOpen(false);
                };
                window.addEventListener('click', handleGlobalClick);
                return () => {
                    window.removeEventListener('click', handleGlobalClick);
                };
            }, []);

            useEffect(() => {
                if (activeTab === "home") {
                    const slideTimer = setInterval(() => {
                        setCurrentSlide(prev => (prev + 1) % carouselSlides.length);
                    }, 5000);
                    return () => clearInterval(slideTimer);
                }
            }, [activeTab]);

            // Scroll listener for back-to-top button visibility
            useEffect(() => {
                const handleScroll = () => {
                    if (window.scrollY > 400) {
                        setShowBackToTop(true);
                    } else {
                        setShowBackToTop(false);
                    }
                };
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            // Synchronize weighing metrics on boot
            useEffect(() => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    try {
                        google.script.run.withSuccessHandler((dbMetrics) => {
                            if (dbMetrics && Object.keys(dbMetrics).length > 0) {
                                setBarangayNutritionData(dbMetrics);
                            }
                        }).fetchBarangayMetrics();
                    } catch(e) {
                        console.warn("Google Apps Script context not fully operational:", e);
                    }
                }
            }, []);

            useEffect(() => {
                if (currentUser) {
                    if (currentUser.barangay) {
                        setFormBarangay(currentUser.barangay);
                    }
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        try {
                            google.script.run.withSuccessHandler((dbData) => {
                                if (dbData && dbData.length > 0) setUploadedFiles(dbData);
                            }).fetchDocumentRegistry();

                            google.script.run.withSuccessHandler((dbLogs) => {
                                if (dbLogs && dbLogs.length > 0) setSysLogs(dbLogs);
                            }).fetchSystemLogs();
                        } catch(e) {
                            console.warn("Database sync error:", e);
                        }
                    }
                }
            }, [currentUser]);

            const handleFormLogin = (e) => {
                e.preventDefault();
                if (!privacyConsented) {
                    showNotification("Under Republic Act 10173 (Data Privacy Act), you must review and consent to the data processing agreement before accessing personal records.", "error");
                    return;
                }
                setIsSubmittingAuth(true);

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSubmittingAuth(false);
                            if (res.success) {
                                setCurrentUser(res.profile);
                                setLoginEmail("");
                                setLoginPassword("");
                                showNotification(`Welcome, ${res.profile.name}!`, "success");
                                setActiveTab("portal-home");
                            } else {
                                showNotification(res.error, "error");
                            }
                        })
                        .withFailureHandler((err) => {
                            setIsSubmittingAuth(false);
                            showNotification("Critical Server Error connecting to Apps Script API.", "error");
                        })
                        .authenticateUser(loginEmail, loginPassword);
                } else {
                    // Sandbox local verification fallback
                    setTimeout(() => {
                        setIsSubmittingAuth(false);
                        const cleanEmail = loginEmail.toLowerCase().trim();
                        
                        const sandboxDatabase = {
                            "stephydetty14@gmail.com": {
                                password: "officer123",
                                profile: { id: "TNJ-OFF-10", name: "Stephy Detty", role: "Officer", title: "Tanjay City Nutrition Action Officer (CNAO)" }
                            },
                            "christian.labe@caremin.com": {
                                password: "bns123",
                                profile: { id: "TNJ-BNS-30", name: "Christian Labe", role: "BNS", title: "Barangay Nutrition Scholar", barangay: "Poblacion IV" }
                            }
                        };

                        const account = sandboxDatabase[cleanEmail];
                        if (account && account.password === loginPassword) {
                            setCurrentUser(account.profile);
                            setLoginEmail("");
                            setLoginPassword("");
                            showNotification(`Sandbox Success! Logged in as ${account.profile.name}`, "success");
                            setActiveTab("portal-home");
                        } else {
                            showNotification("Invalid Sandbox credentials.", "error");
                        }
                    }, 500);
                }
            };

            const handleLogout = () => {
                if (currentUser && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.logAction(currentUser.name, "Logged out from session");
                }
                setCurrentUser(null);
                setPrivacyConsented(false);
                setActiveTab("home");
                showNotification("Logged out successfully.", "success");
            };

            const handleDigitalMetricsSubmit = (e) => {
                e.preventDefault();
                const total = Number(rawNormal) + Number(rawUnderweight) + Number(rawStunted) + Number(rawOverweight);
                if (total <= 0) {
                    showNotification("Total weighed children cannot be zero.", "error");
                    return;
                }

                setIsSubmittingMetrics(true);
                const pctNormal = Number(((rawNormal / total) * 100).toFixed(1));
                const pctUnderweight = Number(((rawUnderweight / total) * 100).toFixed(1));
                const pctStunted = Number(((rawStunted / total) * 100).toFixed(1));
                const pctOverweight = Number(((rawOverweight / total) * 100).toFixed(1));

                const uploader = currentUser ? currentUser.name : "System";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSubmittingMetrics(false);
                            if (res.success) {
                                showNotification("e-OPT metric counts registered successfully!", "success");
                                setRawNormal("");
                                setRawUnderweight("");
                                setRawStunted("");
                                setRawOverweight("");
                                
                                // Refresh current dataset
                                google.script.run.withSuccessHandler((dbMetrics) => {
                                    if (dbMetrics) setBarangayNutritionData(dbMetrics);
                                }).fetchBarangayMetrics();
                                
                                google.script.run.withSuccessHandler((dbLogs) => {
                                    setSysLogs(dbLogs);
                                }).fetchSystemLogs();
                            } else {
                                showNotification(res.error, "error");
                            }
                        })
                        .saveBarangayMetrics(formBarangay, pctNormal, pctUnderweight, pctStunted, pctOverweight, total, uploader);
                } else {
                    // Sandbox fallback
                    setTimeout(() => {
                        setIsSubmittingMetrics(false);
                        const updatedMetrics = {
                            ...barangayNutritionData,
                            [formBarangay]: {
                                normal: pctNormal,
                                underweight: pctUnderweight,
                                stunted: pctStunted,
                                overweight: pctOverweight,
                                totalWeighed: total
                            }
                        };
                        setBarangayNutritionData(updatedMetrics);
                        setRawNormal("");
                        setRawUnderweight("");
                        setRawStunted("");
                        setRawOverweight("");
                        showNotification("Metrics updated successfully (Sandbox Mode)!", "success");
                    }, 600);
                }
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFileToUpload(e.target.files[0]);
                }
            };

            const handleFileUploadSubmit = (e) => {
                e.preventDefault();
                if (!selectedFileToUpload) {
                    showNotification("Please select a physical file to upload.", "error");
                    return;
                }

                const file = selectedFileToUpload;
                const sizeString = (file.size / (1024 * 1024)).toFixed(1) + " MB";
                const uploader = currentUser ? currentUser.name : "Guest Scholar";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    showNotification("Uploading file to Google Drive & logging to Sheet...", "info");
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Data = evt.target.result;
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (res.success) {
                                    showNotification(res.message, "success");
                                    google.script.run.withSuccessHandler((dbData) => {
                                        setUploadedFiles(dbData);
                                    }).fetchDocumentRegistry();
                                    google.script.run.withSuccessHandler((dbLogs) => {
                                        setSysLogs(dbLogs);
                                    }).fetchSystemLogs();
                                } else {
                                    showNotification(res.message, "error");
                                }
                            })
                            .uploadFileToDrive(base64Data, file.name, fileCategory, uploader, sizeString);
                    };
                    reader.readAsDataURL(file);
                } else {
                    const newDoc = {
                        id: "eOPT-" + Math.floor(1000 + Math.random() * 9000),
                        fileName: file.name,
                        size: sizeString,
                        type: fileCategory,
                        uploadedBy: uploader,
                        date: new Date().toISOString().split('T')[0],
                        status: "Pending",
                        feedback: ""
                    };
                    setUploadedFiles([newDoc, ...uploadedFiles]);
                    showNotification("File uploaded (Sandbox)", "success");
                }

                setSelectedFileToUpload(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleApproveDocument = (docId, feedbackText) => {
                const feedback = feedbackText || "Validated by Nutrition Specialist.";
                const reviewer = currentUser ? currentUser.name : "Reviewer";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                showNotification(`Document ${docId} approved.`, "success");
                                google.script.run.withSuccessHandler((dbData) => {
                                    setUploadedFiles(dbData);
                                }).fetchDocumentRegistry();
                                google.script.run.withSuccessHandler((dbLogs) => {
                                    setSysLogs(dbLogs);
                                }).fetchSystemLogs();
                            } else {
                                showNotification(res.message, "error");
                            }
                        })
                        .updateDocumentStatusInSheet(docId, "Approved", feedback, reviewer);
                } else {
                    setUploadedFiles(prev => prev.map(doc => {
                        if (doc.id === docId) {
                            return { ...doc, status: "Approved", feedback: feedback };
                        }
                        return doc;
                    }));
                    showNotification(`Document ${docId} approved (Sandbox).`, "success");
                }
            };

            const handleRejectDocument = (docId, feedbackText) => {
                const feedback = feedbackText || "Requires signature in bottom corner.";
                const reviewer = currentUser ? currentUser.name : "Reviewer";

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                showNotification(`Document ${docId} marked for review.`, "error");
                                google.script.run.withSuccessHandler((dbData) => {
                                    setUploadedFiles(dbData);
                                }).fetchDocumentRegistry();
                                google.script.run.withSuccessHandler((dbLogs) => {
                                    setSysLogs(dbLogs);
                                }).fetchSystemLogs();
                            } else {
                                showNotification(res.message, "error");
                            }
                        })
                        .updateDocumentStatusInSheet(docId, "Needs Revision", feedback, reviewer);
                } else {
                    setUploadedFiles(prev => prev.map(doc => {
                        if (doc.id === docId) {
                            return { ...doc, status: "Needs Revision", feedback: feedback };
                        }
                        return doc;
                    }));
                    showNotification(`Document ${docId} marked for review (Sandbox).`, "error");
                }
            };

            const handleBmiCalculation = (e) => {
                e.preventDefault();
                if (!calculatorHeight || !calculatorWeight) {
                    showNotification("Please fill in both height and weight.", "error");
                    return;
                }
                const heightInMeters = parseFloat(calculatorHeight) / 100;
                const weightInKg = parseFloat(calculatorWeight);
                const bmi = (weightInKg / (heightInMeters * heightInMeters)).toFixed(1);
                
                let classification = "";
                let advice = "";
                let colorClass = "";

                if (bmi < 18.5) {
                    classification = "Underweight / Wasted";
                    colorClass = "text-[#1da187] bg-emerald-50 border-emerald-200";
                    advice = "Incorporate nutrient-dense foods using local Tanjay agricultural crops. We highly recommend adding Moringa (Malunggay) powder to soups, eating locally grown Sweet Potato (Camote), fresh eggs, Mung Beans (Munggo), and participating in the local Nutri-Instant Champorado SBFP programs.";
                } else if (bmi >= 18.5 && bmi < 24.9) {

                                                <button 
                                                    type="submit" 
                                                    disabled={isSubmittingMetrics}
                                                    className="w-full bg-[#1da187] hover:bg-emerald-800 text-white font-bold text-xs py-3 rounded-xl transition-all flex items-center justify-center gap-1 min-h-[44px]"
                                                >
                                                    {isSubmittingMetrics ? "Saving..." : "Upload Weighing Records"}
                                                </button>
                                            </form>
                                        </div>

                                        {/* Audit Logs */}
                                        {currentUser.role !== "BNS" && (
                                            <div className="bg-white rounded-2xl border border-emerald-100 p-4 sm:p-5 shadow-sm animate-fadeIn">
                                                <h4 className="font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-fingerprint text-slate-400"></i> Audit logs & System Tracks
                                                </h4>
                                                <div className="space-y-3 font-mono text-[10px] max-h-[200px] overflow-y-auto pr-2">
                                                    {sysLogs.map((log, i) => (
                                                        <div key={i} className="p-2 bg-slate-50 rounded-lg border border-slate-100 flex justify-between gap-2">
                                                            <div>
                                                                <span className="text-slate-400">[{log.time}]</span> <strong>{log.user}</strong>: {log.action}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="lg:col-span-2 space-y-6">
                                        
                                        {/* Optional File Uploads */}
                                        <div className="bg-white rounded-2xl border border-emerald-100 p-4 sm:p-5 shadow-sm">
                                            <h4 className="font-bold text-slate-800 text-sm sm:text-base mb-4 flex items-center gap-1.5 border-b border-slate-100 pb-2">
                                                <i className="fa-solid fa-cloud-arrow-up text-[#1da187]"></i> Secure Registry File Uploads
                                            </h4>

                                            <form onSubmit={handleFileUploadSubmit} className="space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1.5">Category</label>
                                                        <select 
                                                            value={fileCategory} 
                                                            onChange={(e) => setFileCategory(e.target.value)}
                                                            className="w-full bg-slate-50 text-slate-800 text-xs font-bold px-3 py-3 rounded-xl border border-slate-200 focus:outline-none min-h-[44px]"
                                                        >
                                                            <option value="Feeding Logs">RA 11037 School Feeding Logs</option>
                                                            <option value="Census Document">Community Census / Survey Update</option>
                                                            <option value="Executive Clearance">LGU Executive Sign-off</option>
                                                            <option value="e-OPT Spreadsheet (.xlsx)">Supplemental e-OPT Spreadsheet (.xlsx)</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1.5">Physical File</label>
                                                        <div className="border-2 border-dashed border-[#1da187]/20 hover:border-[#1da187]/50 bg-emerald-50/10 hover:bg-emerald-50/40 rounded-xl p-3 text-center cursor-pointer relative transition-all min-h-[44px]">
                                                            <input 
                                                                type="file" 
                                                                ref={fileInputRef}
                                                                onChange={handleFileChange}
                                                                className="absolute inset-0 opacity-0 cursor-pointer"
                                                            />
                                                            <i className="fa-solid fa-paperclip text-sm text-[#1da187] mr-1"></i>
                                                            <span className="text-[11px] text-slate-700 font-bold">
                                                                {selectedFileToUpload ? selectedFileToUpload.name.slice(0, 15) + '...' : "Choose File..."}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button type="submit" className="w-full bg-[#1da187] hover:bg-emerald-600 text-white font-bold text-xs py-2.5 rounded-xl transition-all min-h-[44px]">
                                                    Transmit File Backup
                                                </button>
                                            </form>
                                        </div>

                                        {/* Direct list Registry */}
                                        <div className="bg-white rounded-2xl border border-emerald-100 p-4 sm:p-5 shadow-sm">
                                            <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                                                <h4 className="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-1.5">
                                                    <i className="fa-solid fa-list-check text-[#1da187]"></i> Document Registry Status
                                                </h4>
                                                <span className="bg-slate-100 text-slate-650 text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full">
                                                    {uploadedFiles.filter(doc => currentUser.role !== "BNS" || doc.uploadedBy === currentUser.name).length} Records
                                                </span>
                                            </div>

                                            <div className="space-y-4 max-h-[360px] lg:max-h-[480px] overflow-y-auto pr-2">
                                                {uploadedFiles
                                                    .filter(doc => currentUser.role !== "BNS" || doc.uploadedBy === currentUser.name)
                                                    .map((doc) => (
                                                    <div key={doc.id} className="p-3 sm:p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition-all">
                                                        <div className="space-y-1 w-full">
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <span className="font-mono text-[10px] sm:text-xs font-bold text-[#1da187]">{doc.id}</span>
                                                                <span className={`text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                                                    doc.status === 'Approved' ? 'bg-emerald-100 text-emerald-900' :
                                                                    doc.status === 'Pending' ? 'bg-amber-100 text-amber-900' : 'bg-red-100 text-red-800'
                                                                }`}>
                                                                    {doc.status}
                                                                </span>
                                                                <span className="text-[9px] bg-slate-200 text-slate-750 font-bold px-2 py-0.5 rounded-md">{doc.type}</span>
                                                            </div>
                                                            <h5 className="font-bold text-slate-850 text-xs sm:text-sm break-all">{doc.fileName}</h5>
                                                            <p className="text-[9px] sm:text-[10px] text-slate-500">
                                                                Uploaded by: <strong>{doc.uploadedBy}</strong> on {doc.date} ({doc.size})
                                                            </p>
                                                            {doc.feedback && (
                                                                <div className="mt-2 text-[10px] sm:text-[11px] bg-white p-2 rounded-lg border border-slate-100 text-slate-605">
                                                                    <i className="fa-solid fa-comment-dots text-[#1da187]"></i> Feedback: <em>{doc.feedback}</em>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <div className="flex gap-2 shrink-0 w-full sm:w-auto justify-end pt-1 sm:pt-0">
                                                            {doc.status === "Pending" && (currentUser.role === "Officer") ? (
                                                                <div className="flex gap-1.5 w-full sm:w-auto justify-end">
                                                                    <button 
                                                                        onClick={() => handleApproveDocument(doc.id, "Validated under PPAN standards.")}
                                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[10px] sm:text-xs py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1 min-h-[36px]"
                                                                    >
                                                                        <i className="fa-solid fa-check"></i> Approve
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => handleRejectDocument(doc.id, "Requires revision to meet NNC formats.")}
                                                                        className="bg-rose-700 hover:bg-rose-800 text-white font-bold text-[10px] sm:text-xs py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1 min-h-[36px]"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i> Decline
                                                                    </button>
                                                                </div>
                                                            ) : (
                                                                <button 
                                                                    onClick={() => showNotification(`Opening file...`)}
                                                                    className="text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 font-bold text-xs py-1.5 px-3 rounded-lg flex items-center gap-1 transition-all min-h-[36px]"
                                                                >
                                                                    <i className="fa-solid fa-download"></i> Download
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Weekly Nutrition Plan Aligned with RA 8976 & RA 8172 */}
                                        {currentUser.role === "Officer" && (
                                            <div className="bg-gradient-to-br from-[#1da187]/5 to-[#1da187]/10 rounded-2xl border border-emerald-100 p-4 sm:p-5 shadow-sm">
                                                <h4 className="font-bold text-emerald-900 text-xs sm:text-sm md:text-base mb-3 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-kitchen-set text-[#1da187]"></i> Localized Menu Planner (NNC RA 8976 & RA 8172 Compliance)
                                                </h4>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div className="space-y-2">
                                                        <label className="block text-xs font-bold text-slate-600 uppercase">Target Day</label>
                                                        <select 
                                                            value={selectedDay} 
                                                            onChange={(e) => setSelectedDay(e.target.value)}
                                                            className="w-full bg-white text-slate-800 text-xs font-bold px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none min-h-[44px]"
                                                        >
                                                            {Object.keys(menuPlan).map(day => (
                                                                <option key={day} value={day}>{day}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                    <div className="md:col-span-2 space-y-2">
                                                        <label className="block text-xs font-bold text-slate-600">Formulation Parameters</label>
                                                        <form onSubmit={handleUpdateMenu} className="flex gap-2">
                                                            <input 
                                                                type="text" 
                                                                value={editMenuInput}
                                                                onChange={(e) => setEditMenuInput(e.target.value)}
                                                                placeholder={menuPlan[selectedDay]}
                                                                className="flex-grow bg-white text-slate-800 text-xs px-3 py-2 rounded-xl border border-slate-200 min-h-[44px]"
                                                                required
                                                            />
                                                            <button type="submit" className="bg-[#1da187] hover:bg-emerald-655 text-white font-bold text-xs px-4 py-2 rounded-xl min-h-[44px]">
                                                                Save
                                                            </button>
                                                        </form>
                                                    </div>
                                                </div>

                                                <div className="mt-4 p-3.5 bg-white rounded-xl border border-[#1da187]/10 text-[11px] sm:text-xs font-semibold text-slate-700">
                                                    <span className="block text-[8px] sm:text-[9px] uppercase font-black text-slate-400 tracking-wider">Scheduled Dish for {selectedDay}:</span>
                                                    <p className="text-emerald-950 mt-1">"{menuPlan[selectedDay]}"</p>
                                                </div>
                                            </div>
                                        )}

                                        {/* Whitelisting details */}
                                        {currentUser.role === "Officer" && (
                                            <div className="bg-white rounded-2xl border border-emerald-100 p-4 sm:p-5 shadow-sm animate-fadeIn">
                                                <h4 className="font-bold text-slate-800 text-sm sm:text-base mb-4 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-users text-[#1da187]"></i> Ground BNS Officers Registry (PD 1569 Compliance)
                                                </h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[300px] overflow-y-auto pr-2">
                                                    {staffList.map((staff) => (
                                                        <div key={staff.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                                                            <div>
                                                                <span className="text-[8px] sm:text-[9px] uppercase font-bold text-slate-450">{staff.role} {staff.barangay ? `• ${staff.barangay}` : ''}</span>
                                                                <h5 className="font-bold text-slate-800 text-xs">{staff.name}</h5>
                                                                <span className="block text-[9px] sm:text-[10px] font-mono text-[#1da187] mt-0.5 break-all">{staff.email}</span>
                                                            </div>
                                                            <span className="text-[9px] sm:text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-[#1da187]/20 shrink-0">
                                                                {staff.status}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* FOOTER */}
                    <footer id="footer" className="bg-[#1da187] text-white mt-12 border-t-4 border-[#3ce6c3] scroll-mt-24 relative">
                        <div className="max-w-[1700px] mx-auto px-4 xl:px-12 2xl:px-16 py-8 md:py-12">
                            
                            <div className="flex items-center justify-center md:justify-start gap-4 mb-6 pb-6 border-b border-white/20">
                                <img src="https://i.imgur.com/VRnnRFC.png" alt="Tanjay LGU" className="h-10 w-10 sm:h-12 sm:w-12 object-contain drop-shadow-md" />
                                <div className="relative h-10 w-10 sm:h-12 sm:w-12">
                                    <div className="absolute inset-0 bg-white rounded-full"></div>
                                    <img src="https://i.imgur.com/Paf57TV.png" alt="Nutrition Council" className="h-10 w-10 sm:h-12 sm:w-12 object-contain relative z-10 p-0.5 drop-shadow-md" />
                                </div>
                                <img src="https://i.imgur.com/FeIVYGK.png" alt="Bagong Pilipinas" className="h-10 w-10 sm:h-12 sm:w-12 object-contain drop-shadow-md" />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="space-y-3">
                                    <h4 className="font-extrabold text-xs sm:text-base text-white uppercase tracking-widest">TCNC Mandate Compliance</h4>
                                    <p className="text-xs text-white/95 leading-relaxed font-medium">
                                        The Tanjay City Nutrition Council operates under directives of **PD 491** and the national **PPAN 2023-2028** framework to curb malnutrition, manage stunting indices, and foster multi-sectoral health safeguards.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <h4 className="font-extrabold text-xs sm:text-sm text-white uppercase tracking-wide">Government Portals</h4>
                                    <ul className="text-xs text-white/90 space-y-2 font-semibold">
                                        <li><a href="https://www.gov.ph" target="_blank" className="hover:underline text-white hover:text-[#3ce6c3]"><i className="fa-solid fa-angle-right mr-1"></i> GOV.PH Portal</a></li>
                                        <li><a href="https://nnc.gov.ph" target="_blank" className="hover:underline text-white hover:text-[#3ce6c3]"><i className="fa-solid fa-angle-right mr-1"></i> National Nutrition Council Website</a></li>
                                    </ul>
                                </div>

                                <div className="space-y-3">
                                    <h4 className="font-extrabold text-xs sm:text-sm text-white uppercase tracking-wide">Contact Desk</h4>
                                    <div className="text-xs text-white/90 space-y-3 font-semibold">
                                        <p className="flex items-center gap-2"><i className="fa-solid fa-phone text-white"></i> Hotline: (035) 415-3119</p>
                                        <p className="flex items-center gap-2"><i className="fa-solid fa-envelope text-white"></i> nutrition@tanjay.gov.ph</p>
                                        <p className="flex items-center gap-2">
                                            <a href="https://www.facebook.com/tanjaycitynutrition" target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 hover:text-[#3ce6c3]">
                                                <i className="fa-brands fa-facebook text-white"></i> Tanjay City Nutrition Page
                                            </a>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#157763] py-4 text-[10px] sm:text-xs text-center text-white/85 border-t border-white/10 px-4">
                            <div className="max-w-[1700px] mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
                                <p className="text-white font-medium text-center sm:text-left">© 2026 Tanjay City Nutrition Council. Built in accordance with Philippine National Nutrition Policies.</p>
                                <p className="text-[9px] sm:text-[10px] text-white/75 font-semibold text-center sm:text-right shrink-0">PPAN 2023-2028 Local LGU Integration Standard | RA 10173 DPA Compliant.</p>
                            </div>
                        </div>
                    </footer>

                    {/* INTERACTIVE UI ACCESSIBILITY TOOLBAR & BACK-TO-TOP STACKED VERTICALLY */}
                    <div className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 flex flex-col gap-2">
                        {/* 1. AUTO UP SCROLL BUTTON (Always rendering first in standard column layout on scroll detection) */}
                        {showBackToTop && (
                            <button 
                                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                className="w-10 h-10 sm:w-11 sm:h-11 bg-[#1da187] hover:bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center border border-white/20 animate-fadeIn"
                                title="Scroll to Top"
                                aria-label="Scroll to top of page"
                            >
                                <i className="fa-solid fa-chevron-up"></i>
                            </button>
                        )}

                        {/* 2. ACCESSIBILITY MENU DROPDOWN (Positioned directly under/below the auto-up scroll button) */}
                        <div className="relative group">
                            <button 
                                className="w-10 h-10 sm:w-11 sm:h-11 bg-slate-950 hover:bg-slate-800 text-white rounded-full shadow-2xl flex items-center justify-center border border-slate-700 transition-colors"
                                aria-label="Open accessibility options"
                            >
                                <i className="fa-solid fa-universal-access text-lg sm:text-xl"></i>
                            </button>
                            
                            {/* Consolidated Access Panel (Renders directly above/to-the-left of trigger block upon hover) */}
                            <div className="absolute bottom-12 right-0 bg-white border border-slate-200 p-3.5 rounded-2xl shadow-2xl space-y-3 w-48 opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-300 scale-95 origin-bottom-right group-hover:scale-100 z-55">
                                
                                <div className="space-y-2.5 text-xs">
                                    {/* Shortcut 1: Accessibility Statement Document Modal */}
                                    <button 
                                        onClick={() => setShowAccessStatementModal(true)} 
                                        className="w-full text-left font-bold text-slate-700 hover:text-[#1da187] flex items-center gap-2 py-1 min-h-[32px]"
                                        title="Read Web Accessibility Statement Guidelines"
                                    >
                                        <i className="fa-regular fa-file-lines text-sm"></i>
                                        <span>Accessibility Policy</span>
                                    </button>

                                    {/* Shortcut 2: High Contrast Eye Switch */}
                                    <button 
                                        onClick={() => setHighContrastMode(!highContrastMode)} 
                                        className="w-full text-left font-bold text-slate-700 hover:text-[#1da187] flex items-center gap-2 py-1 min-h-[32px]"
                                        title="Toggle Contrast Level"
                                    >
                                        <i className="fa-solid fa-eye-slash text-xs"></i>
                                        <span>Contrast Switch</span>
                                    </button>

                                    {/* Shortcut 3: Skip straight to Dashboard data blocks */}
                                    <button 
                                        onClick={() => document.getElementById("main-content")?.scrollIntoView({ behavior: 'smooth' })} 
                                        className="w-full text-left font-bold text-slate-700 hover:text-[#1da187] flex items-center gap-2 py-1 min-h-[32px]"
                                        title="Skip to analytical graphs and records"
                                    >
                                        <i className="fa-solid fa-circle-down text-xs"></i>
                                        <span>Skip to Dashboard</span>
                                    </button>

                                    {/* Shortcut 4: Skip directly to contact/footer details */}
                                    <button 
                                        onClick={() => document.getElementById("footer")?.scrollIntoView({ behavior: 'smooth' })} 
                                        className="w-full text-left font-bold text-slate-700 hover:text-[#1da187] flex items-center gap-2 py-1 min-h-[32px]"
                                        title="Skip to local support and hotlines"
                                    >
                                        <i className="fa-solid fa-chevron-down text-xs"></i>
                                        <span>Skip to Footer</span>
                                    </button>

                                    <hr className="border-slate-150" />

                                    {/* Shortcut 5: Native relative Text Scaler */}
                                    <div className="flex items-center justify-between pt-1">
                                        <span className="font-bold text-slate-500 text-[10px] uppercase">Text Size</span>
                                        <div className="flex gap-1">
                                            <button 
                                                onClick={() => setFontSizeScale(prev => Math.min(prev + 0.05, 1.2))} 
                                                className="w-6 h-6 bg-slate-100 font-bold rounded hover:bg-slate-200 text-xs flex items-center justify-center min-h-[24px]"
                                                title="Increase Font Size scale"
                                            >
                                                +
                                            </button>
                                            <button 
                                                onClick={() => setFontSizeScale(prev => Math.max(prev - 0.05, 0.85))} 
                                                className="w-6 h-6 bg-slate-100 font-bold rounded hover:bg-slate-200 text-xs flex items-center justify-center min-h-[24px]"
                                                title="Decrease Font Size scale"
                                            >
                                                -
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
